<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="52%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#4c0519" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- iOS Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- Liquid Glass Specular Sheen -->
  <rect width="512" height="512" rx="116" fill="url(#gloss)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- QR Motif -->
  <g filter="url(#shadow)">
    <!-- Top-Left Finder -->
    <rect x="108" y="108" width="124" height="124" rx="28" fill="none" stroke="#ffffff" stroke-width="26"/>
    <rect x="148" y="148" width="44" height="44" rx="12" fill="#ffffff"/>

    <!-- Top-Right Finder -->
    <rect x="280" y="108" width="124" height="124" rx="28" fill="none" stroke="#ffffff" stroke-width="26"/>
    <rect x="320" y="148" width="44" height="44" rx="12" fill="#ffffff"/>

    <!-- Bottom-Left Finder -->
    <rect x="108" y="280" width="124" height="124" rx="28" fill="none" stroke="#ffffff" stroke-width="26"/>
    <rect x="148" y="320" width="44" height="44" rx="12" fill="#ffffff"/>

    <!-- Bottom-Right Data Modules -->
    <rect x="274" y="274" width="52" height="52" rx="14" fill="#ffffff"/>
    <rect x="354" y="274" width="52" height="52" rx="14" fill="#ffffff" fill-opacity="0.88"/>
    <rect x="274" y="354" width="52" height="52" rx="14" fill="#ffffff" fill-opacity="0.88"/>
    <!-- Warm Gold Signature Accent (matching Portfolio) -->
    <circle cx="380" cy="380" r="28" fill="#fde68a"/>
  </g>
</svg>
